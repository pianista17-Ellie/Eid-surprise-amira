<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    position: relative;
    overflow: hidden;
}

/* ✨ estrellas */
.wrapper::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 25px 25px;
    opacity: 0.4;
    animation: blink 2s infinite alternate;
}

/* 🌙 luna */
.moon {
    position: absolute;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    z-index: 2;
    animation: float 4s ease-in-out infinite;
}

/* 🏮 faroles (intercalados) */
.lamp {
    position: absolute;
    top: 0;
    animation: swing 3s ease-in-out infinite;
}

/* tamaños alternados */
.l1 { left: 5%; width: 40px; }
.l2 { left: 25%; width: 70px; }
.l3 { left: 45%; width: 40px; }
.l4 { right: 25%; width: 70px; }
.l5 { right: 5%; width: 40px; }

/* ☁️ banner GRANDE centrado */
.banner {
    position: absolute;
    top: 180px;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 420px;
    z-index: 1;
    animation: fadeIn 2s ease;
}

/* ✨ texto sobre banner */
.text {
    position: absolute;
    top: 240px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 300px;
    z-index: 2;
    animation: fadeIn 3s ease;
}

/* 👉 botón NEXT */
.next {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    cursor: pointer;
    transition: 0.2s;
}

.next:hover {
    transform: translateX(-50%) scale(1.1);
}

/* animaciones */
@keyframes swing {
    0% { transform: rotate(6deg); }
    50% { transform: rotate(-6deg); }
    100% { transform: rotate(6deg); }
}

@keyframes float {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -10px); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ✨ parpadeo estrellas */
@keyframes blink {
    from { opacity: 0.2; }
    to { opacity: 0.5; }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- 🏮 faroles -->
    <img src="../assets/img/lamp.png" class="lamp l1">
    <img src="../assets/img/lamp.png" class="lamp l2">
    <img src="../assets/img/lamp.png" class="lamp l3">
    <img src="../assets/img/lamp.png" class="lamp l4">
    <img src="../assets/img/lamp.png" class="lamp l5">

    <!-- ☁️ banner -->
    <img src="../assets/img/banner.png" class="banner">

    <!-- 🌙 luna -->
    <img src="../assets/img/moon.png" class="moon">

    <!-- ✨ texto -->
    <img src="../assets/img/texto.png" class="text">

    <!-- 👉 next -->
    <img src="../assets/img/next.png" class="next" onclick="goNext()">

</div>

<script>
function goNext() {
    window.location.href = "../foryou/";
}
</script>

</body>
</html>
