<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    position: relative;
    overflow: hidden;
}

/* ✨ estrellas */
.stars, .stars2 {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: twinkle 3s infinite alternate;
}

.stars {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 2px, transparent 2px),
        radial-gradient(white 1.5px, transparent 1.5px);
    background-size: 90px 90px, 140px 140px, 120px 120px;
    background-position: 0 0, 40px 60px, 80px 30px;
    opacity: 0.5;
}

.stars2 {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 2px, transparent 2px);
    background-size: 110px 110px, 160px 160px;
    background-position: 20px 80px, 70px 20px;
    opacity: 0.3;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 0.6; }
}

/* 🏮 FAROLES GRANDES (4) */
.lamp {
    position: absolute;
    width: 110px;
    animation: swing 3s ease-in-out infinite;
}

/* posiciones naturales */
.l1 { top: -10px; left: 15%; animation-duration: 3s; }
.l2 { top: 15px; left: 35%; animation-duration: 2.6s; }
.l3 { top: -5px; left: 60%; animation-duration: 3.4s; }
.l4 { top: 10px; left: 80%; animation-duration: 2.8s; }

/* ☁️ banner */
.banner {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    z-index: 1;
}

/* 🌙 luna (entrada + flotación) */
.moon {
    position: absolute;
    top: 410px;
    left: 50%;
    transform: translateX(-50%);
    width: 95px;
    z-index: 2;
    animation: moonIn 1.5s ease forwards, float 4s ease-in-out infinite;
}

/* ✨ texto (entrada elegante abajo) */
.text {
    position: absolute;
    top: 540px;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    max-width: 260px;
    z-index: 2;
    animation: textIn 2s ease forwards;
}

/* 👉 botón */
.next {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    cursor: pointer;
    transition: 0.2s;
}

.next:hover {
    transform: translateX(-50%) scale(1.1);
}

/* animaciones */
@keyframes swing {
    0% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}

@keyframes float {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -8px); }
}

@keyframes moonIn {
    from {
        opacity: 0;
        transform: translate(-50%, -20px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

@keyframes textIn {
    from {
        opacity: 0;
        transform: translate(-50%, 20px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="stars"></div>
    <div class="stars2"></div>

    <!-- 🏮 -->
    <img src="../assets/img/lamp.png" class="lamp l1">
    <img src="../assets/img/lamp.png" class="lamp l2">
    <img src="../assets/img/lamp.png" class="lamp l3">
    <img src="../assets/img/lamp.png" class="lamp l4">

    <!-- ☁️ -->
    <img src="../assets/img/banner.png" class="banner">

    <!-- 🌙 -->
    <img src="../assets/img/moon.png" class="moon">

    <!-- ✨ -->
    <img src="../assets/img/texto.png" class="text">

    <!-- 👉 -->
    <img src="../assets/img/next.png" class="next" onclick="goNext()">

</div>

<script>
function goNext() {
    window.location.href = "../foryou/";
}
</script>

</body>
</html>
