<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    position: relative;
    overflow: hidden;
}

/* ✨ estrellas tipo cielo (random visual) */
.stars, .stars2 {
    position: absolute;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    animation: twinkle 3s infinite alternate;
}

.stars {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1.5px, transparent 1.5px),
        radial-gradient(white 2px, transparent 2px);
    background-size: 80px 80px, 120px 120px, 160px 160px;
    background-position: 0 0, 40px 60px, 20px 100px;
    opacity: 0.5;
}

.stars2 {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 2px, transparent 2px);
    background-size: 100px 100px, 140px 140px;
    background-position: 30px 20px, 70px 90px;
    opacity: 0.3;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 0.6; }
}

/* 🏮 faroles (más largos y juntos) */
.lamp {
    position: absolute;
    top: -20px;
    animation: swing 3s ease-in-out infinite;
}

/* alternados pero más compactos */
.l1 { left: 12%; width: 55px; }
.l2 { left: 30%; width: 85px; }
.l3 { left: 48%; width: 55px; }
.l4 { left: 66%; width: 85px; }
.l5 { left: 82%; width: 55px; }

/* ☁️ banner más abajo */
.banner {
    position: absolute;
    top: 260px;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 420px;
    z-index: 1;
}

/* 🌙 luna DENTRO del banner */
.moon {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 65px;
    z-index: 2;
    animation: float 4s ease-in-out infinite;
}

/* ✨ texto dentro del banner */
.text {
    position: absolute;
    top: 340px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    max-width: 260px;
    z-index: 2;
}

/* 👉 botón NEXT abajo */
.next {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    cursor: pointer;
    transition: 0.2s;
}

.next:hover {
    transform: translateX(-50%) scale(1.1);
}

/* animaciones */
@keyframes swing {
    0% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}

@keyframes float {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -8px); }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- ✨ estrellas -->
    <div class="stars"></div>
    <div class="stars2"></div>

    <!-- 🏮 faroles -->
    <img src="../assets/img/lamp.png" class="lamp l1">
    <img src="../assets/img/lamp.png" class="lamp l2">
    <img src="../assets/img/lamp.png" class="lamp l3">
    <img src="../assets/img/lamp.png" class="lamp l4">
    <img src="../assets/img/lamp.png" class="lamp l5">

    <!-- ☁️ banner -->
    <img src="../assets/img/banner.png" class="banner">

    <!-- 🌙 luna -->
    <img src="../assets/img/moon.png" class="moon">

    <!-- ✨ texto -->
    <img src="../assets/img/texto.png" class="text">

    <!-- 👉 next -->
    <img src="../assets/img/next.png" class="next" onclick="goNext()">

</div>

<script>
function goNext() {
    window.location.href = "../foryou/";
}
</script>

</body>
</html>
