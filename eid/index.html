<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    position: relative;
    overflow: hidden;
}

/* ✨ estrellas */
.stars, .stars2 {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: twinkle 3s infinite alternate;
}

.stars {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 2px, transparent 2px),
        radial-gradient(white 1.5px, transparent 1.5px);
    background-size: 90px 90px, 140px 140px, 120px 120px;
    background-position: 0 0, 40px 60px, 80px 30px;
    opacity: 0.5;
}

.stars2 {
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 2px, transparent 2px);
    background-size: 110px 110px, 160px 160px;
    background-position: 20px 80px, 70px 20px;
    opacity: 0.3;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 0.6; }
}

/* 🏮 FAROLES naturales */
.lamp {
    position: absolute;
    width: 90px;
    animation: swing 3s ease-in-out infinite;
}

/* posiciones desordenadas (clave) */
.l1 { top: -10px; left: 10%; animation-duration: 3s; }
.l2 { top: 10px; left: 30%; animation-duration: 2.5s; }
.l3 { top: -5px; left: 50%; animation-duration: 3.5s; }
.l4 { top: 15px; left: 70%; animation-duration: 2.8s; }
.l5 { top: 0px; left: 85%; animation-duration: 3.2s; }

/* ☁️ banner */
.banner {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    z-index: 1;
}

/* 🌙 luna (ajustada) */
.moon {
    position: absolute;
    top: 400px; /* más abajo */
    left: 50%;
    transform: translateX(-50%);
    width: 90px; /* más grande */
    z-index: 2;
}

/* ✨ texto (se mantiene abajo dentro del banner) */
.text {
    position: absolute;
    top: 520px;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    max-width: 260px;
    z-index: 2;
}

/* 👉 botón */
.next {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    cursor: pointer;
}

.next:hover {
    transform: translateX(-50%) scale(1.1);
}

/* animación */
@keyframes swing {
    0% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="stars"></div>
    <div class="stars2"></div>

    <!-- 🏮 -->
    <img src="../assets/img/lamp.png" class="lamp l1">
    <img src="../assets/img/lamp.png" class="lamp l2">
    <img src="../assets/img/lamp.png" class="lamp l3">
    <img src="../assets/img/lamp.png" class="lamp l4">
    <img src="../assets/img/lamp.png" class="lamp l5">

    <!-- ☁️ -->
    <img src="../assets/img/banner.png" class="banner">

    <!-- 🌙 -->
    <img src="../assets/img/moon.png" class="moon">

    <!-- ✨ -->
    <img src="../assets/img/texto.png" class="text">

    <!-- 👉 -->
    <img src="../assets/img/next.png" class="next" onclick="goNext()">

</div>

<script>
function goNext() {
    window.location.href = "../foryou/";
}
</script>

</body>
</html>
