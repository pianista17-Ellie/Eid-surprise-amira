<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    position: relative;
    overflow: hidden;
}

/* 🌙 luna centrada arriba */
.moon {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    animation: float 4s ease-in-out infinite;
}

/* 🏮 faroles */
.lamp {
    position: absolute;
    width: 55px;
    top: 0;
    animation: swing 3s ease-in-out infinite;
}

.lamp.l1 { left: 5%; }
.lamp.l2 { left: 25%; }
.lamp.l3 { right: 25%; }
.lamp.l4 { right: 5%; }

/* banner nube */
.banner {
    position: absolute;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 320px;
    animation: fadeIn 2s ease;
}

/* texto (imagen) */
.text {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 280px;
    animation: fadeIn 3s ease;
}

/* botón next */
.next {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    cursor: pointer;
    transition: 0.2s;
}

.next:hover {
    transform: translateX(-50%) scale(1.1);
}

/* animaciones */
@keyframes swing {
    0% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}

@keyframes float {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -10px); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- 🌙 -->
    <img src="../assets/img/moon.png" class="moon">

    <!-- 🏮 4 faroles -->
    <img src="../assets/img/lamp.png" class="lamp l1">
    <img src="../assets/img/lamp.png" class="lamp l2">
    <img src="../assets/img/lamp.png" class="lamp l3">
    <img src="../assets/img/lamp.png" class="lamp l4">

    <!-- ☁️ banner -->
    <img src="../assets/img/banner.png" class="banner">

    <!-- ✨ texto -->
    <img src="../assets/img/texto.png" class="text">

    <!-- 👉 next -->
    <img src="../assets/img/next.png" class="next" onclick="goNext()">

</div>

<script>
function goNext() {
    window.location.href = "../foryou/";
}
</script>

</body>
</html>
