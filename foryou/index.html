<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    animation: fadeIn 1.2s ease;
}

/* ✨ título grande */
.title {
    width: 95%;
    max-width: 420px;
    margin-top: 10px;
    animation: slideDown 1s ease;
}

/* grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
}

/* tarjetas */
.card {
    position: relative;
}

.card img {
    width: 100%;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
}

/* 💖 brillo rosado */
.card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 15px;
    background: radial-gradient(circle, rgba(255,150,200,0.4), transparent 70%);
    opacity: 0;
    transition: 0.3s;
}

.card:hover::after {
    opacity: 1;
}

.card:hover img {
    transform: scale(1.05);
}

/* botones */
.buttons {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
}

.buttons img {
    width: 130px;
    cursor: pointer;
    transition: 0.2s;
}

.buttons img:hover {
    transform: scale(1.1);
}

/* animaciones */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- 🟥 título -->
    <img src="../assets/img/title.png" class="title">

    <!-- 🟦 grid -->
    <div class="grid">

        <div class="card" onclick="go('letter')">
            <img src="../assets/img/card1.png">
        </div>

        <div class="card" onclick="go('flowers')">
            <img src="../assets/img/card2.png">
        </div>

        <div class="card" onclick="go('video')">
            <img src="../assets/img/card3.png">
        </div>

        <div class="card" onclick="go('photos')">
            <img src="../assets/img/card4.png">
        </div>

        <div class="card" onclick="go('music')">
            <img src="../assets/img/card5.png">
        </div>

        <div class="card" onclick="go('time')">
            <img src="../assets/img/card6.png">
        </div>

    </div>

    <!-- 🔘 botón return -->
    <div class="buttons">
        <img src="../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<!-- 🔊 sonido -->
<audio id="clickSound" src="../assets/audio/click.mp3"></audio>

<script>
function playSound() {
    const sound = document.getElementById("clickSound");
    sound.currentTime = 0;
    sound.play();
}

function go(section) {
    playSound();
    setTimeout(() => {
        window.location.href = "../sections/" + section + "/index.html";
    }, 200);
}

function goBack() {
    playSound();
    setTimeout(() => {
        window.location.href = "../eid/";
    }, 200);
}
</script>

</body>
</html>
