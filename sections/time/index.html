<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* CONTENEDOR MÁS GRANDE */
.container {
    width: 100%;
    max-width: 480px; /* 🔥 más grande */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
}

/* TITULO */
.title {
    width: 85%;
    max-width: 340px;
}

/* FECHA */
.date {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    color: #a00000;
}

/* FILAS */
.row{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0;
}

/* CONTENEDOR DE NÚMEROS */
.numbers{
  display:flex;
  gap:12px;
}

/* 🔥 BLOQUES MÁS GRANDES */
.num{
  width:60px;
  height:90px;
  background:#d31621;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  border-radius:14px;
  font-weight:700;
  font-family: 'Montserrat', sans-serif;
}

/* LABEL AL COSTADO */
.label{
  margin-left:18px;
  color:#a00000;
  font-size:16px;
  letter-spacing:2px;
  font-weight:700;
  font-family: 'Montserrat', sans-serif;
}

/* RETURN MÁS PROPORCIONAL */
.return img {
    width: 130px;
    cursor: pointer;
    margin-top: 15px;
}

/* ENTRADA */
.fadeIn {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container fadeIn">

    <!-- titulo -->
    <img src="../../assets/img/time.png" class="title">

    <!-- fecha -->
    <div class="date">05/02/2025 13:38pm</div>

    <!-- CONTADOR -->

    <div class="row">
      <div class="numbers" id="days"></div>
      <div class="label">: DAYS</div>
    </div>

    <div class="row">
      <div class="numbers" id="hours"></div>
      <div class="label">: HOURS</div>
    </div>

    <div class="row">
      <div class="numbers" id="minutes"></div>
      <div class="label">: MINUTES</div>
    </div>

    <div class="row">
      <div class="numbers" id="seconds"></div>
      <div class="label">: SECONDS</div>
    </div>

    <!-- return -->
    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

const startDate = new Date("2025-02-05T13:38:00");

function updateTime(){
  const now = new Date();
  const diff = now - startDate;

  const seconds = Math.floor(diff / 1000) % 60;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  display("days", days);
  display("hours", hours);
  display("minutes", minutes);
  display("seconds", seconds);
}

function display(id, value){
  const container = document.getElementById(id);
  container.innerHTML = "";

  const str = value.toString().padStart(2, "0");

  for(let i=0; i<str.length; i++){
    const div = document.createElement("div");
    div.className = "num";
    div.textContent = str[i];
    container.appendChild(div);
  }
}

setInterval(updateTime, 1000);
updateTime();

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
