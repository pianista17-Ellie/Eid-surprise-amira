<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* INTRO */
.intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.heart {
    font-size: 50px;
    color: #d31621;
    animation: heartbeat 1.2s infinite;
}

.click-text {
    font-size: 14px;
    color: #a00000;
}

/* CONTENEDOR */
.container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

/* TITULO */
.title {
    width: 85%;
    max-width: 340px;
    opacity: 0;
}

/* FECHA */
.date {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    color: #a00000;
    opacity: 0;
}

/* FILAS */
.row{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:6px 0;
}

/* NÚMEROS */
.numbers{
  display:flex;
  gap:8px;
}

/* BLOQUES */
.num{
  width:52px;
  height:78px;
  background:#d31621;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  border-radius:14px;
  font-weight:700;
  font-family: 'Montserrat', sans-serif;
}

/* LABEL */
.label{
  margin-left:16px;
  color:#a00000;
  font-size:15px;
  letter-spacing:2px;
  font-weight:700;
  font-family: 'Montserrat', sans-serif;
}

/* RETURN */
.return img {
    width: 130px;
    cursor: pointer;
    margin-top: 12px;
    opacity: 0;
}

/* ANIMACIONES */
@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

.fadeDown {
    animation: fadeDown 1s forwards;
}

.fadeUp {
    animation: fadeUp 1s forwards;
}

@keyframes fadeDown {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
}

@keyframes fadeUp {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" onclick="startTime()">
    <div class="heart">❤</div>
    <div class="click-text">click here</div>
</div>

<!-- CONTENIDO -->
<div class="container" id="content">

    <img src="../../assets/img/time.png" class="title" id="title">

    <div class="date" id="date">05/02/2025 13:38pm</div>

    <div class="row">
      <div class="numbers" id="days"></div>
      <div class="label">: DAYS</div>
    </div>

    <div class="row">
      <div class="numbers" id="hours"></div>
      <div class="label">: HOURS</div>
    </div>

    <div class="row">
      <div class="numbers" id="minutes"></div>
      <div class="label">: MINUTES</div>
    </div>

    <div class="row">
      <div class="numbers" id="seconds"></div>
      <div class="label">: SECONDS</div>
    </div>

    <div class="return">
        <img src="../../assets/img/return.png" id="returnBtn" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>
<audio id="music" src="../../assets/audio/music4.mp3" loop></audio>

<script>
const clickSound = document.getElementById("click");
const music = document.getElementById("music");

const content = document.getElementById("content");
const title = document.getElementById("title");
const dateText = document.getElementById("date");
const returnBtn = document.getElementById("returnBtn");

/* INICIO */
function startTime(){
    clickSound.play();

    music.volume = 0;
    music.play();

    let vol = 0;
    let fade = setInterval(()=>{
        if(vol < 1){
            vol += 0.03;
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    },120);

    document.querySelector(".intro").style.display = "none";
    content.style.display = "flex";

    setTimeout(()=> title.classList.add("fadeDown"), 200);
    setTimeout(()=> dateText.classList.add("fadeDown"), 400);
    setTimeout(()=> returnBtn.style.opacity = "1", 800);
}

/* CONTADOR */
const startDate = new Date("2025-02-05T13:38:00");

function updateTime(){
  const now = new Date();
  const diff = now - startDate;

  const seconds = Math.floor(diff / 1000) % 60;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  display("days", days);
  display("hours", hours);
  display("minutes", minutes);
  display("seconds", seconds);
}

function display(id, value){
  const container = document.getElementById(id);
  container.innerHTML = "";

  const str = value.toString().padStart(2, "0");

  for(let i=0; i<str.length; i++){
    const div = document.createElement("div");
    div.className = "num";
    div.textContent = str[i];
    container.appendChild(div);
  }
}

setInterval(updateTime, 1000);
updateTime();

/* RETURN */
function goBack(){
    clickSound.play();
    music.pause();
    music.currentTime = 0;

    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
