<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* CONTENEDOR */
.container {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

/* TITULO */
.title {
    width: 65%;
    max-width: 240px;
}

/* FECHA */
.date {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    color: #a00000;
    margin-top: -5px;
}

/* CONTADOR */
.timer {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

/* FILA */
.time-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* RECTANGULO */
.box {
    background: #d31621;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    width: 70px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    letter-spacing: 2px;
}

/* TEXTO LATERAL */
.label {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    color: #a00000;
}

/* RETURN */
.return img {
    width: 150px;
    cursor: pointer;
    margin-top: 20px;
}

/* ENTRADA */
.fadeIn {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container fadeIn">

    <!-- titulo -->
    <img src="../../assets/img/time.png" class="title">

    <!-- fecha -->
    <div class="date">05/02/2025 13:38pm</div>

    <!-- contador -->
    <div class="timer">

        <div class="time-row">
            <div class="box" id="days">00</div>
            <div class="label">days</div>
        </div>

        <div class="time-row">
            <div class="box" id="hours">00</div>
            <div class="label">hours</div>
        </div>

        <div class="time-row">
            <div class="box" id="minutes">00</div>
            <div class="label">minutes</div>
        </div>

        <div class="time-row">
            <div class="box" id="seconds">00</div>
            <div class="label">seconds</div>
        </div>

    </div>

    <!-- return -->
    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

/* FECHA INICIO */
const startDate = new Date("2025-02-05T13:38:00");

/* ELEMENTOS */
const d = document.getElementById("days");
const h = document.getElementById("hours");
const m = document.getElementById("minutes");
const s = document.getElementById("seconds");

function updateTime(){
    const now = new Date();
    let diff = Math.floor((now - startDate) / 1000);

    let days = Math.floor(diff / (3600 * 24));
    diff %= (3600 * 24);

    let hours = Math.floor(diff / 3600);
    diff %= 3600;

    let minutes = Math.floor(diff / 60);
    let seconds = diff % 60;

    d.textContent = days.toString().padStart(2,'0');
    h.textContent = hours.toString().padStart(2,'0');
    m.textContent = minutes.toString().padStart(2,'0');
    s.textContent = seconds.toString().padStart(2,'0');
}

setInterval(updateTime, 1000);
updateTime();

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
