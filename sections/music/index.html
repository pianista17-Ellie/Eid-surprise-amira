<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* contenedor vertical */
.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    box-sizing: border-box;
}

/* titulo */
.title {
    width: 70%;
    max-width: 260px;
}

/* reproductor */
.player {
    position: relative;
    width: 90%;
    max-width: 320px;
}

/* base spoty */
.spoty {
    width: 100%;
    display: block;
}

/* disco girando */
.disc {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    animation: spin 6s linear infinite;
}

/* boton play */
.play {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 22%;
    cursor: pointer;
    animation: heartbeat 1.4s infinite;
}

/* return */
.return img {
    width: 150px;
    cursor: pointer;
}

/* animaciones */
@keyframes spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
}

@keyframes heartbeat {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
    100% { transform: translate(-50%, -50%) scale(1); }
}
</style>
</head>

<body>

<div class="container">

    <!-- titulo -->
    <img src="../../assets/img/playlist.png" class="title">

    <!-- reproductor -->
    <div class="player">
        <img src="../../assets/img/spoty.png" class="spoty">
        <img src="../../assets/img/disc.png" class="disc">
        <img src="../../assets/img/play.png" class="play" onclick="openSpotify()">
    </div>

    <!-- return -->
    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

function openSpotify(){
    clickSound.play();

    setTimeout(()=>{
        window.location.href = "https://open.spotify.com/playlist/5983jfYnT4scUbOZKb0vZ2";
    },200);
}

function goBack(){
    clickSound.play();

    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
