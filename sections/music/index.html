<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* CONTENEDOR */
.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
}

/* INTRO */
.intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.heart {
    font-size: 50px;
    color: red;
    animation: heartbeat 1.2s infinite;
}

.small-heart {
    font-size: 20px;
    color: red;
    animation: heartbeat 1.2s infinite;
}

.click-text {
    font-size: 14px;
    color: #a00000;
}

/* TITULO */
.title {
    width: 80%;
    max-width: 300px;
    margin-top: -10px;
    opacity: 0;
}

/* PLAYER */
.player {
    position: relative;
    width: 85%;
    max-width: 320px;
    opacity: 0;
}

.spoty {
    width: 100%;
}

/* DISCO */
.disc {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 72%;
    animation: spin 12s linear infinite;
}

.play {
    position: absolute;
    bottom: 6%;
    left: 38%; /
    transform: translateX(-50%);
    width: 24%;
    cursor: pointer;
    animation: heartbeat 1.4s infinite;
}

/* RETURN */
.return img {
    width: 150px;
    cursor: pointer;
}

/* NOTAS */
.notes {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.note {
    position: absolute;
    color: #ff9eb5;
    font-size: 18px;
    opacity: 0;
    animation: floatNote 6s infinite;
}

.note:nth-child(1){ left:10%; animation-delay:0s;}
.note:nth-child(2){ left:30%; animation-delay:2s;}
.note:nth-child(3){ left:70%; animation-delay:1s;}
.note:nth-child(4){ left:85%; animation-delay:3s;}
.note:nth-child(5){ left:50%; animation-delay:4s;}

/* ANIMACIONES */
@keyframes spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

@keyframes floatNote {
    0% { bottom: 0; opacity: 0; }
    30% { opacity: 1; }
    100% { bottom: 100%; opacity: 0; }
}

/* ENTRADAS */
.fadeTitle {
    animation: fadeDown 1s ease forwards;
}

.fadePlayer {
    animation: fadeUp 1s ease forwards;
}

@keyframes fadeDown {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
}

@keyframes fadeUp {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" onclick="startExperience()">
    <div class="heart">❤</div>
    <div class="click-text">click here</div>
    <div class="small-heart">❤</div>
</div>

<!-- CONTENIDO -->
<div class="container" id="content">

    <div class="notes">
        <div class="note">♪</div>
        <div class="note">♫</div>
        <div class="note">♬</div>
        <div class="note">♪</div>
        <div class="note">♫</div>
    </div>

    <img src="../../assets/img/playlist.png" class="title" id="title">

    <div class="player" id="player">
        <img src="../../assets/img/spoty.png" class="spoty">
        <img src="../../assets/img/disc.png" class="disc">
        <img src="../../assets/img/play.png" class="play" onclick="openSpotify()">
    </div>

    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>
<audio id="music" src="../../assets/audio/music2arab.mp3" loop></audio>

<script>
const clickSound = document.getElementById("click");
const music = document.getElementById("music");
const content = document.getElementById("content");
const title = document.getElementById("title");
const player = document.getElementById("player");

function startExperience(){
    clickSound.play();

    // fade in música
    music.volume = 0;
    music.play();

    let vol = 0;
    let fade = setInterval(()=>{
        if(vol < 1){
            vol += 0.05;
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    },100);

    document.querySelector(".intro").style.display = "none";
    content.style.display = "flex";

    // animaciones entrada
    setTimeout(()=> title.classList.add("fadeTitle"), 200);
    setTimeout(()=> player.classList.add("fadePlayer"), 500);
}

function openSpotify(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "https://open.spotify.com/playlist/5983jfYnT4scUbOZKb0vZ2";
    },200);
}

function goBack(){
    clickSound.play();

    // detener música
    music.pause();
    music.currentTime = 0;

    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
