<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    overflow: hidden;
}

/* contenedor */
.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    position: relative;
}

/* titulo */
.title {
    width: 70%;
    max-width: 260px;
    z-index: 2;
}

/* player */
.player {
    position: relative;
    width: 85%;
    max-width: 320px;
    z-index: 2;
}

.spoty {
    width: 100%;
    display: block;
}

/* 🔥 DISCO MÁS GRANDE Y UN POCO MÁS ARRIBA */
.disc {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 68%;
    animation: spin 11s linear infinite;
}

/* 🔥 PLAY MÁS ABAJO Y MÁS GRANDE */
.play {
    position: absolute;
    bottom: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 22%;
    cursor: pointer;
    animation: heartbeat 1.4s infinite;
}

/* return */
.return img {
    width: 150px;
    cursor: pointer;
    z-index: 2;
}

/* ✨ NOTAS MUSICALES FONDO */
.notes {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.note {
    position: absolute;
    font-size: 18px;
    color: #ff9eb5;
    opacity: 0;
    animation: floatNote 6s infinite ease-in;
}

/* posiciones random */
.note:nth-child(1){ left:10%; animation-delay:0s;}
.note:nth-child(2){ left:25%; animation-delay:2s;}
.note:nth-child(3){ left:70%; animation-delay:1s;}
.note:nth-child(4){ left:85%; animation-delay:3s;}
.note:nth-child(5){ left:50%; animation-delay:4s;}

/* animaciones */
@keyframes spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
}

@keyframes heartbeat {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
}

@keyframes floatNote {
    0% {
        bottom: 0;
        opacity: 0;
        transform: translateY(0) scale(0.8);
    }
    30% {
        opacity: 1;
    }
    100% {
        bottom: 100%;
        opacity: 0;
        transform: translateY(-40px) scale(1.2);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ✨ notas -->
    <div class="notes">
        <div class="note">♪</div>
        <div class="note">♫</div>
        <div class="note">♪</div>
        <div class="note">♬</div>
        <div class="note">♫</div>
    </div>

    <!-- titulo -->
    <img src="../../assets/img/playlist.png" class="title">

    <!-- player -->
    <div class="player">
        <img src="../../assets/img/spoty.png" class="spoty">
        <img src="../../assets/img/disc.png" class="disc">
        <img src="../../assets/img/play.png" class="play" onclick="openSpotify()">
    </div>

    <!-- return -->
    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

function openSpotify(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "https://open.spotify.com/playlist/5983jfYnT4scUbOZKb0vZ2";
    },200);
}

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
