<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre</title>

<!-- ✨ fuente elegante -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    padding: 25px;
    box-sizing: border-box;
    text-align: center;
}

/* título */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: #a00000;
    opacity: 0;
    animation: showTitle 1.5s ease forwards;
}

/* ratón */
.mouse {
    width: 180px;
    margin: 10px auto;
    display: block;
    opacity: 0;
    animation: showMouse 1.5s ease forwards;
    animation-delay: 1.5s;
}

/* texto */
.text {
    font-family: 'Libre Baskerville', serif;
    color: #7a0000;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin-top: 10px;
}

/* botón */
.back {
    margin-top: 20px;
}

.back img {
    width: 130px;
    cursor: pointer;
}

/* animaciones */
@keyframes showTitle {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes showMouse {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- ✨ título -->
    <div class="title">Salam Aleikum Habibi...</div>

    <!-- 🐭 ratón -->
    <img src="../../assets/img/ratoncito.gif" class="mouse">

    <!-- 💌 texto -->
    <div id="text" class="text"></div>

    <!-- 🔘 volver -->
    <div class="back" onclick="goBack()">
        <img src="../../assets/img/return.png">
    </div>

</div>

<!-- 🎵 música -->
<audio id="music" src="../../assets/audio/music1.mp3" loop></audio>

<script>
const content = `D’abord, pardonne-moi pour le retard :c …

Je crois que je t’admire…
ta foi, ta gentillesse,
et ces gestes

comme te souvenir
de moi dans tes prières,
ne sont pas passés inaperçus.

Je ne savais rien du Ramadan…
jusqu’à ce que je commence à le voir à travers toi.

J’ai découvert quelque chose de nouveau…
et, sans m’en rendre compte, j’ai commencé à l’admirer.

Je pense qu’on a rarement l’occasion
de connaître quelque chose d’aussi différent…
et en même temps, si sincère.

Merci de m’avoir laissé voir un petit bout de ton monde.

Et, avec beaucoup de respect,
merci aussi à ta maman…
pour m’avoir permis de rester dans ta vie,
même à distance.

Inshallah, un jour je pourrai vivre un Ramadan là-bas…
et comprendre plus profondément
ce que je commence à peine à apprécier.

Eid Mubarak…!`;

let i = 0;
const speed = 25;
const textDiv = document.getElementById("text");
const music = document.getElementById("music");

/* escribir texto */
function typeWriter() {
    if (i < content.length) {
        textDiv.innerHTML += content.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

/* secuencia */
window.onload = () => {

    // activar música al primer click
    document.body.addEventListener("click", () => {
        music.play();
    }, { once: true });

    // iniciar escritura después de 3s (1.5 título + 1.5 ratón)
    setTimeout(typeWriter, 3000);
};

/* volver */
function goBack() {
    music.pause();
    music.currentTime = 0;
    window.location.href = "../../foryou/";
}
</script>

</body>
</html>
