<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

.wrapper {
    width: 100%;
    max-width: 520px;
    padding: 25px;
    text-align: center;
}

/* título */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: #a00000;
    opacity: 0;
    animation: showTitle 2.5s ease forwards;
}

/* ratón */
.mouse {
    width: 240px;
    margin: 20px auto 5px;
    display: block;
    cursor: pointer;
    opacity: 0;
    animation: showMouse 2s ease forwards;
    animation-delay: 2.5s;
}

/* latido separado */
.heartbeat {
    animation: heartbeat 1.8s infinite;
    animation-delay: 4.5s;
}

/* texto guía */
.hint {
    font-family: 'Libre Baskerville', serif;
    font-size: 12px;
    color: #a00000;
    opacity: 0;
    animation: fadeHint 2s ease forwards;
    animation-delay: 4.5s;
    transition: opacity 0.4s ease;
}

/* ocultar hint */
.hint.hide {
    opacity: 0;
}

/* texto carta */
.text {
    font-family: 'Libre Baskerville', serif;
    color: #7a0000;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    margin-top: 15px;
}

/* botón */
.back {
    margin-top: 20px;
}

.back img {
    width: 130px;
    cursor: pointer;
}

/* animaciones */
@keyframes showTitle {
    from {opacity: 0; transform: translateY(-25px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes showMouse {
    from {opacity: 0; transform: translateY(25px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes heartbeat {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
}

@keyframes fadeHint {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="title">Salam Aleikum Habibi...</div>

    <!-- 👇 IMPORTANTE: clase heartbeat separada -->
    <img src="../../assets/img/ratoncito.gif" class="mouse heartbeat" id="mouse">

    <div class="hint" id="hint">[click the mouse]</div>

    <div id="text" class="text"></div>

    <div class="back" onclick="goBack()">
        <img src="../../assets/img/return.png">
    </div>

</div>

<audio id="music" src="../../assets/audio/music1.mp3" loop></audio>
<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const content = `D’abord, pardonne-moi pour le retard :c …

Je crois que je t’admire…
ta foi, ta gentillesse,
et ces gestes

comme te souvenir
de moi dans tes prières,
ne sont pas passés inaperçus.

Je ne savais rien du Ramadan…
jusqu’à ce que je commence à le voir à travers toi.

J’ai découvert quelque chose de nouveau…
et, sans m’en rendre compte, j’ai commencé à l’admirer.

Je pense qu’on a rarement l’occasion
de connaître quelque chose d’aussi différent…
et en même temps, si sincère.

Merci de m’avoir laissé voir un petit bout de ton monde.

Et, avec beaucoup de respect,
merci aussi à ta maman…
pour m’avoir permis de rester dans ta vie,
même à distance.

Inshallah, un jour je pourrai vivre un Ramadan là-bas…
et comprendre plus profondément
ce que je commence à peine à apprécier.

Eid Mubarak…!`;

let i = 0;
const speed = 65;
const textDiv = document.getElementById("text");
const music = document.getElementById("music");
const clickSound = document.getElementById("click");
const mouse = document.getElementById("mouse");
const hint = document.getElementById("hint");

/* escribir texto */
function typeWriter() {
    if (i < content.length) {
        textDiv.innerHTML += content.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

/* click */
mouse.addEventListener("click", () => {

    clickSound.play();

    // iniciar música
    music.volume = 0.8;
    music.play().catch(()=>{});

    // 🔥 quitar SOLO el latido
    mouse.classList.remove("heartbeat");

    // 🔥 ocultar texto guía
    hint.classList.add("hide");

    // iniciar escritura
    setTimeout(typeWriter, 800);

}, { once: true });

function goBack() {
    clickSound.play();
    music.pause();
    music.currentTime = 0;

    setTimeout(() => {
        window.location.href = "../../foryou/";
    }, 200);
}
</script>

</body>
</html>
