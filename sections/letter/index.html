<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* contenedor */
.wrapper {
    width: 100%;
    max-width: 520px;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
}

/* título grande */
.title {
    font-family: "Brush Script MT", cursive;
    font-size: 40px;
    color: #a00000;
    margin-bottom: 10px;
}

/* ratón */
.mouse {
    position: absolute;
    top: 120px;
    left: 0;
    width: 180px;
}

/* texto */
.text {
    font-family: "Lucida Handwriting", "Lucida Calligraphy", cursive;
    color: #7a0000;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
}

/* botón */
.back {
    margin-top: 20px;
    text-align: center;
}

.back img {
    width: 130px;
    cursor: pointer;
}

/* cursor parpadeante */
.cursor {
    display: inline-block;
    width: 2px;
    background: #7a0000;
    margin-left: 3px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%,50%,100% {opacity:1;}
    25%,75% {opacity:0;}
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- ✨ título -->
    <div class="title">Salam Aleikum Habibi...</div>

    <!-- 🐭 ratón -->
    <img src="../../assets/img/ratoncito.gif" class="mouse">

    <!-- 💌 texto -->
    <div id="text" class="text"></div>

    <!-- botón -->
    <div class="back" onclick="goBack()">
        <img src="../../assets/img/return.png">
    </div>

</div>

<!-- 🎵 música -->
<audio id="music" src="../../assets/audio/music1.mp3" autoplay loop></audio>

<script>
const content = `D’abord, pardonne-moi pour le retard :c …

Je crois que je t’admire…
ta foi, ta gentillesse,
et ces gestes

comme te souvenir
de moi dans tes prières,
ne sont pas passés inaperçus.

Je ne savais rien du Ramadan…
jusqu’à ce que je commence à le voir à travers toi.

J’ai découvert quelque chose de nouveau…
et, sans m’en rendre compte, j’ai commencé à l’admirer.

Je pense qu’on a rarement l’occasion
de connaître quelque chose d’aussi différent…
et en même temps, si sincère.

Merci de m’avoir laissé voir un petit bout de ton monde.

Et, avec beaucoup de respect,
merci aussi à ta maman…
pour m’avoir permis de rester dans ta vie,
même à distance.

Inshallah, un jour je pourrai vivre un Ramadan là-bas…
et comprendre plus profondément
ce que je commence à peine à apprécier.

Eid Mubarak…!`;

let i = 0;
const speed = 25;
const textDiv = document.getElementById("text");

function typeWriter() {
    if (i < content.length) {
        textDiv.innerHTML += content.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

window.onload = () => {
    typeWriter();

    // activar audio (necesita interacción en algunos móviles)
    const music = document.getElementById("music");
    document.body.addEventListener("click", () => {
        music.play();
    }, { once: true });
};

function goBack() {
    window.location.href = "../../foryou/";
}
</script>

</body>
</html>
