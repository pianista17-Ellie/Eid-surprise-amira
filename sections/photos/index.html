<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* contenedor */
.container {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    box-sizing: border-box;
}

/* titulo */
.title {
    width: 70%;
    max-width: 260px;
    margin: 10px 0 20px;
}

/* grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
}

.grid img {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.grid img:hover {
    transform: scale(1.05);
}

/* return */
.return {
    margin: 25px 0 10px;
}

.return img {
    width: 150px;
    cursor: pointer;
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

/* imagen grande */
.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 12px;
    transition: 0.3s;
}

/* botones navegación */
.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 35px;
    color: white;
    cursor: pointer;
    user-select: none;
}

.prev { left: 15px; }
.next { right: 15px; }

/* cerrar */
.close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 32px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <img src="../../assets/img/fhotos.png" class="title">

    <div class="grid">
        <img src="../../assets/img/img1.png" onclick="openImg(0)">
        <img src="../../assets/img/img2.png" onclick="openImg(1)">
        <img src="../../assets/img/img3.png" onclick="openImg(2)">
        <img src="../../assets/img/img4.png" onclick="openImg(3)">
        <img src="../../assets/img/img5.png" onclick="openImg(4)">
        <img src="../../assets/img/img6.png" onclick="openImg(5)">
        <img src="../../assets/img/img7.png" onclick="openImg(6)">
        <img src="../../assets/img/img8.png" onclick="openImg(7)">
        <img src="../../assets/img/img9.png" onclick="openImg(8)">
        <img src="../../assets/img/img10.png" onclick="openImg(9)">
        <img src="../../assets/img/img11.png" onclick="openImg(10)">
        <img src="../../assets/img/img12.png" onclick="openImg(11)">
        <img src="../../assets/img/img13.png" onclick="openImg(12)">
        <img src="../../assets/img/img14.png" onclick="openImg(13)">
        <img src="../../assets/img/img15.png" onclick="openImg(14)">
        <img src="../../assets/img/img16.png" onclick="openImg(15)">
    </div>

    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeImg()">✕</span>
    <span class="nav prev" onclick="prevImg()">❮</span>
    <img id="lightbox-img">
    <span class="nav next" onclick="nextImg()">❯</span>
</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

const images = [
"../../assets/img/img1.png",
"../../assets/img/img2.png",
"../../assets/img/img3.png",
"../../assets/img/img4.png",
"../../assets/img/img5.png",
"../../assets/img/img6.png",
"../../assets/img/img7.png",
"../../assets/img/img8.png",
"../../assets/img/img9.png",
"../../assets/img/img10.png",
"../../assets/img/img11.png",
"../../assets/img/img12.png",
"../../assets/img/img13.png",
"../../assets/img/img14.png",
"../../assets/img/img15.png",
"../../assets/img/img16.png"
];

let current = 0;

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function openImg(index){
    current = index;
    lightbox.style.display = "flex";
    lightboxImg.src = images[current];
}

function closeImg(){
    lightbox.style.display = "none";
}

function nextImg(){
    current = (current + 1) % images.length;
    lightboxImg.src = images[current];
}

function prevImg(){
    current = (current - 1 + images.length) % images.length;
    lightboxImg.src = images[current];
}

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}
</script>

</body>
</html>
