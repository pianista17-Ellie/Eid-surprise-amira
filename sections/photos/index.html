<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

/* contenedor */
.container {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    box-sizing: border-box;
}

/* titulo */
.title {
    width: 70%;
    max-width: 260px;
    margin: 10px 0 20px;
    animation: fadeDown 1s ease;
}

/* grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
}

.grid img {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

/* return */
.return {
    margin: 25px 0 10px;
}

.return img {
    width: 150px;
    cursor: pointer;
}

/* 🔥 GALERÍA FULLSCREEN */
.lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    animation: fadeIn 0.3s ease;
}

.lightbox img {
    max-width: 90%;
    max-height: 85%;
    border-radius: 12px;
    animation: zoomIn 0.3s ease;
}

/* botón cerrar */
.close {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 30px;
    color: white;
    cursor: pointer;
}

/* animaciones */
@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px);}
    to { opacity: 1; transform: translateY(0);}
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes zoomIn {
    from {transform: scale(0.8);}
    to {transform: scale(1);}
}
</style>
</head>

<body>

<div class="container">

    <img src="../../assets/img/fhotos.png" class="title">

    <div class="grid">
        <img src="../../assets/img/img1.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img2.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img3.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img4.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img5.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img6.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img7.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img8.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img9.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img10.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img11.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img12.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img13.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img14.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img15.png" onclick="openImg(this.src)">
        <img src="../../assets/img/img16.png" onclick="openImg(this.src)">
    </div>

    <div class="return">
        <img src="../../assets/img/return.png" onclick="goBack()">
    </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeImg()">
    <span class="close">&times;</span>
    <img id="lightbox-img">
</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}

/* abrir imagen */
function openImg(src){
    lightbox.style.display = "flex";
    lightboxImg.src = src;
}

/* cerrar */
function closeImg(){
    lightbox.style.display = "none";
}
</script>

</body>
</html>
