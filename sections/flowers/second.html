<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Gift</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 25px;
    padding: 20px;
}

/* cartel más grande */
.cartel {
    width: 95%;
    max-width: 360px;
    animation: float 3s ease-in-out infinite;
}

/* contenedor relativo para destellos */
.cartel-wrapper {
    position: relative;
}

/* destellos */
.sparkles {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
}

.sparkles span {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: sparkle 2s infinite;
}

.sparkles span:nth-child(1){ top:10%; left:20%; animation-delay:0s;}
.sparkles span:nth-child(2){ top:30%; left:80%; animation-delay:0.5s;}
.sparkles span:nth-child(3){ top:70%; left:40%; animation-delay:1s;}
.sparkles span:nth-child(4){ top:50%; left:10%; animation-delay:1.5s;}

/* botones IGUALES al index */
.buttons {
    margin-top: 10px;
}

.buttons img {
    width: 140px;
    max-width: 40%; /* 🔥 evita que se agranden */
    margin: 10px;
    cursor: pointer;
}

/* latido */
.come {
    animation: heartbeat 1.4s infinite;
}

/* animaciones */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

@keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0; transform: scale(0.5); }
}
</style>
</head>

<body>

<div class="container">

    <!-- cartel + destellos -->
    <div class="cartel-wrapper">
        <img src="../../assets/img/cartel.png" class="cartel">

        <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- botones -->
    <div class="buttons">
        <img src="../../assets/img/return.png" onclick="goBack()">
        <img src="../../assets/img/come.png" class="come" onclick="goRoblox()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "index.html";
    },200);
}

function goRoblox(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "https://www.roblox.com/es/upgrades/robux?ctx=navpopover";
    },300);
}
</script>

</body>
</html>
