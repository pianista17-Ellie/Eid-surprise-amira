<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* layout vertical limpio */
.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* 🔥 clave */
    gap: 25px; /* 🔥 controla espacio */
    padding: 20px;
}

/* titulo */
.title {
    width: 75%;
    max-width: 280px;
}

/* gif más grande */
.robux {
    width: 95%;
    max-width: 360px;
    animation: float 3s ease-in-out infinite;
}

/* botones */
.buttons {
    margin-top: 10px;
}

.buttons img {
    width: 140px;
    margin: 10px;
    cursor: pointer;
    transition: transform 0.2s;
}

.buttons img:hover {
    transform: scale(1.08);
}

/* animaciones */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<div class="container">

    <img src="../../assets/img/gifttitle.png" class="title">

    <img src="../../assets/img/robux.gif" class="robux">

    <div class="buttons">
        <img src="../../assets/img/return.png" onclick="goBack()">
        <img src="../../assets/img/accept.png" onclick="goNext()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

function goBack(){
    clickSound.play();
    setTimeout(()=>{ window.location.href = "../../foryou/"; },200);
}

function goNext(){
    clickSound.play();
    setTimeout(()=>{ window.location.href = "second.html"; },200);
}
</script>

</body>
</html>
