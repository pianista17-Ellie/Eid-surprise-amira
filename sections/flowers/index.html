<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift</title>

<style>
body {
    margin: 0;
    background: #ffedf4;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
    padding: 30px;
}

/* título */
.title {
    width: 220px;
    margin: 0 auto 20px;
    animation: fadeDown 1s ease;
}

/* gif robux */
.robux {
    width: 260px;
    margin: 10px auto;
    display: block;
    animation: float 3s ease-in-out infinite;
}

/* botones */
.buttons {
    margin-top: 30px;
}

.buttons img {
    width: 130px;
    margin: 10px;
    cursor: pointer;
    transition: transform 0.2s;
}

.buttons img:hover {
    transform: scale(1.08);
}

/* animaciones */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

@keyframes fadeDown {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">

    <!-- titulo png -->
    <img src="../../assets/img/gifttitle.png" class="title">

    <!-- gif -->
    <img src="../../assets/img/robux.gif" class="robux">

    <!-- botones -->
    <div class="buttons">
        <img src="../../assets/img/return.png" onclick="goBack()">
        <img src="../../assets/img/accept.png" onclick="goNext()">
    </div>

</div>

<audio id="click" src="../../assets/audio/click.mp3"></audio>

<script>
const clickSound = document.getElementById("click");

function goBack(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "../../foryou/";
    },200);
}

function goNext(){
    clickSound.play();
    setTimeout(()=>{
        window.location.href = "second.html";
    },200);
}
</script>

</body>
</html>
