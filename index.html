<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise</title>

<style>
body {
    margin: 0;
    background: #043562;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* contenedor principal más grande */
.wrapper {
    width: 100%;
    max-width: 500px; /* más ancho */
    height: 95vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* contenido en columna */
.container {
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px; /* 🔥 separa todo verticalmente */
}

/* título */
.title {
    width: 85%;
    max-width: 320px;
}

/* ratón */
.mouse {
    width: 80%;
    max-width: 260px;
}

/* botones */
.buttons {
    display: flex;
    justify-content: center;
    gap: 40px; /* más separación entre botones */
    position: relative;
    width: 100%;
}

/* botones imagen */
.btn {
    width: 110px; /* 🔥 más grandes */
    cursor: pointer;
    transition: 0.2s;
}

.btn:hover {
    transform: scale(1.1);
}

/* botón NO flotante */
#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="container">

        <img src="assets/img/titulo.png" class="title">

        <img src="assets/img/raton.png" class="mouse">

        <div class="buttons" id="btnArea">
            <img src="assets/img/yes.png" class="btn" onclick="goNext()">
            <img src="assets/img/no.png" class="btn" id="noBtn">
        </div>

    </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("btnArea");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton() {
    const maxX = area.offsetWidth - 100;
    const maxY = 120;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

function goNext() {
    window.location.href = "eid/";
}
</script>

</body>
</html>
